[project]
name = "improve-mmr-1"
version = "0.1.0"
description = "Research on improving Maximal Marginal Relevance"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "sentence-transformers>=3.0",
    "nbformat>=5.9",
    "pytest>=7.0",
    "torch",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true